{% comment %} Generyczny modal HTMX. Pozyskuje content przez include w child template;
   ESC + click outside zamykaja. Focus trap przez x-init focus na pierwszy input. {% endcomment %}

<div id="modal-root"
     x-data="{ open: true }"
     x-show="open"
     x-on:keydown.escape.window="open = false"
     x-on:modal-close.window="open = false"
     x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop"
     x-transition.opacity>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-3xl w-full mx-4 max-h-[90vh] overflow-y-auto border border-gray-200 dark:border-gray-700"
         x-on:click.outside="open = false"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-init="$nextTick(() => { const f = $el.querySelector('input, select, textarea, button'); if (f) f.focus(); })">

        <header class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-900 dark:text-white">{% block modal_title %}Modal{% endblock %}</h2>
            <button type="button"
                    x-on:click="open = false"
                    class="p-1 rounded-md text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700"
                    aria-label="Zamknij">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </header>
        <div class="p-6">
            {% block modal_body %}{% endblock %}
        </div>
    </div>
</div>
