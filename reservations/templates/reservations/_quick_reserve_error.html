{% load i18n %}
{% comment %} Czerwony banner z bledem walidacji / konfliktem. Renderowany przez
   QuickReserveView przy bledzie. Wstrzykiwany do #quick-reserve-result. {% endcomment %}

<div class="rounded-md bg-rose-50 dark:bg-rose-900/30 border-l-4 border-rose-500 p-3 text-sm"
     role="alert">
    <div class="flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-rose-500 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <div class="flex-1">
            <p class="font-semibold text-rose-900 dark:text-rose-200">{% trans "Nie udało się utworzyć rezerwacji" %}</p>
            {% if error %}
                <p class="mt-1 text-rose-800 dark:text-rose-200">{{ error }}</p>
            {% endif %}
        </div>
    </div>
</div>
