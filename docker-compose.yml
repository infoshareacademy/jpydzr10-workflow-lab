# =============================================================================
# Planer Maszyn Budowlanych — środowisko deweloperskie (reference app)
# =============================================================================
#
# Uruchomienie:
#     docker compose up -d                # start w tle
#     docker compose logs -f postgres     # podgląd logów
#     docker compose down                 # zatrzymanie (dane zachowane)
#     docker compose down -v              # zatrzymanie + reset danych (volume)
#
# macOS rekomendacja: OrbStack zamiast Docker Desktop (szybszy, lżejszy).
# Linux: standardowe `docker` + `docker compose`.
#
# Port 5434 — porty na MacOS Sebastian'a (3 projekty równolegle):
#   - 5432 = inny projekt na laptopie (NIE ruszać)
#   - 5433 = sandbox lokalny (Django na :8001)
#   - 5434 = ten projekt kursowy (Django na :8002)
#
# Po `docker compose up -d` PostgreSQL dostępny na localhost:5434
# z credentialami z `.env` (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB).
# Django startujesz osobno: `make run` (→ manage.py runserver 0.0.0.0:8002).
#
# Container name `kursowe-repo-8002` w OrbStack UI pokazuje port Django.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kursowe-repo-8002
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planer_kursowy}
      POSTGRES_USER: ${POSTGRES_USER:-planer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planer_dev_2026}
      # Polskie locale dla sortowania PL i znaków diakrytycznych
      LANG: pl_PL.utf8
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planer} -d ${POSTGRES_DB:-planer_kursowy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit — lokalny „łapacz" maili dla developmentu (SMTP + web UI). Opt-in
  # przez profil `mail`, więc `docker compose up -d` (sam Postgres) go NIE startuje:
  #     docker compose --profile mail up -d        # start Postgres + Mailpit
  # Konfiguracja w `.env`: EMAIL_HOST=localhost EMAIL_PORT=1025 EMAIL_USE_TLS=False.
  # Podgląd przechwyconych maili: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.30.1
    container_name: kursowe-repo-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (tu kieruje Django gdy EMAIL_HOST=localhost)
      - "8025:8025"   # Web UI (podgląd maili w przeglądarce)

volumes:
  postgres_data:
    name: kursowe_repo_data
