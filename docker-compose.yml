# =============================================================================
# Planer Maszyn Budowlanych — środowisko deweloperskie (reference app)
# =============================================================================
#
# Uruchomienie:
#     docker compose up -d                # start w tle
#     docker compose logs -f postgres     # podgląd logów
#     docker compose down                 # zatrzymanie (dane zachowane)
#     docker compose down -v              # zatrzymanie + reset danych (volume)
#
# macOS rekomendacja: OrbStack zamiast Docker Desktop (szybszy, lżejszy).
# Linux: standardowe `docker` + `docker compose`.
#
# Port 5433 — porty na MacOS Sebastian'a (3 projekty równolegle):
#   - 5432 = isocab-postgres (WMS Sebastiana, inny projekt)
#   - 5433 = projekt kursowy (Django runserver na :8002 — patrz Makefile, target `run`)
#   - 5434 = kursowy repo (publiczny infoshareacademy/jpydzr10-workflow-lab)
#
# Po `docker compose up -d` PostgreSQL dostępny na localhost:5433
# z credentialami z `.env` (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB).
# Django startujesz osobno: `make run` (→ manage.py runserver 0.0.0.0:8002).
#
# Container name `kursowe-repo-8002` w OrbStack UI pokazuje port Django.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kursowe-repo-8002
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planer_kursowy}
      POSTGRES_USER: ${POSTGRES_USER:-planer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planer_dev_2026}
      # Polskie locale dla sortowania PL i znaków diakrytycznych
      LANG: pl_PL.utf8
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planer} -d ${POSTGRES_DB:-planer_kursowy}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: kursowe_repo_data
