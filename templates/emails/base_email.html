{% load i18n %}<!DOCTYPE html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr><td style="background:#2563eb;padding:22px 30px;color:#ffffff;font-size:18px;font-weight:bold;">
          Planer Maszyn Budowlanych
          <span style="font-weight:normal;color:#bfdbfe;font-size:14px;">· Construction Machine Planner</span>
        </td></tr>
        <tr><td style="padding:30px;">
          {# Sekcja polska #}
          {{ body_pl|safe }}
          {# Separator dwujęzyczny #}
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:26px 0;">
            <tr>
              <td style="border-top:1px solid #e2e8f0;"></td>
              <td style="width:60px;text-align:center;color:#94a3b8;font-size:11px;letter-spacing:1px;white-space:nowrap;padding:0 8px;">ENGLISH</td>
              <td style="border-top:1px solid #e2e8f0;"></td>
            </tr>
          </table>
          {# Sekcja angielska #}
          {{ body_en|safe }}
        </td></tr>
        <tr><td style="background:#f8fafc;padding:16px 30px;color:#94a3b8;font-size:12px;border-top:1px solid #e2e8f0;">
          Planer Maszyn Budowlanych · Milestone 3 (Django 5.2 LTS)
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
